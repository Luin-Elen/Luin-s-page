<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>李宁的个人网页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- GitHub 入口（把 href 换成你自己的 GitHub 主页链接） -->
  <a class="github-entry" href="https://github.com/Luin-Elen" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
    <svg viewBox="0 0 16 16" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    </svg>
  </a>

  <!-- 首屏：大标题 + 翻盖导航盒 -->
  <header class="hero">
    <h1 class="hero-title">Hello, I'm Luin Elen.</h1>
    <p class="hero-sub">Nice to meet you.</p>

    <!-- 鼠标移上去时盒盖向上翻开，露出三个导航项 -->
    <div class="nav-box" tabindex="0">
      <div class="nav-frame"></div>
      <nav class="nav-inner" aria-label="站点导航">
        <a href="#personal">个人信息</a>
        <a href="#portfolio">作品集</a>
        <a href="#homework">课程作业</a>
      </nav>
      <div class="nav-lid">
        <span class="nav-lid-word">MENU</span>
        <span class="nav-lid-handle" aria-hidden="true"></span>
      </div>
    </div>
  </header>

  <main>
    <!-- 三个板块：内容槽留空，等待填充 -->
    <section id="personal" class="panel">
      <h2>个人信息</h2>
      <div class="slot"></div>
    </section>

    <section id="portfolio" class="panel">
      <h2>作品集</h2>
      <div class="slot"></div>
    </section>

    <section id="homework" class="panel">
      <h2>课程作业</h2>
      <div class="slot"></div>
    </section>
  </main>

  <footer>© Luin Elen · 李宁</footer>

</body>
</html>
